[project]
name = "obligraph"
version = "0.1.0"
description = "Obligraph: regulatory obligations intelligence for Indian financial institutions"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pgvector>=0.3",
    "pydantic[email]>=2.8",
    "pydantic-settings>=2.4",
    "pyjwt[crypto]>=2.9",
    "bcrypt>=4.2",
    "httpx>=0.27",
    "feedparser>=6.0",
    "beautifulsoup4>=4.12",
    "pypdf>=5.0",
    "python-multipart>=0.0.9",
    "anthropic>=1.0",
    "langgraph>=0.3",
    "langgraph-checkpoint-postgres>=2.0",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
]

[project.optional-dependencies]
embeddings = ["fastembed>=0.4"]

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.6"]

[project.scripts]
obligraph = "obligraph.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.vercel]
# Vercel serves the FastAPI `app` exported by index.py (see DEPLOY.md).
entrypoint = "index:app"

[tool.hatch.build.targets.wheel]
packages = ["obligraph"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: FastAPI declares dependencies as Depends() defaults by design.
# E501: `ruff format` owns line length; long string literals are left intact.
ignore = ["B008", "E501", "UP046", "UP047"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
