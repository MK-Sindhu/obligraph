# Obligraph local stack.
#   docker compose up -d db          # just Postgres + pgvector (for `make dev`)
#   docker compose up --build        # everything: db, api, worker, web
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: obligraph
      POSTGRES_PASSWORD: obligraph
      POSTGRES_DB: obligraph
    ports:
      - "127.0.0.1:5442:5432"
    volumes:
      - obligraph-db:/var/lib/postgresql/data
      - ./backend/docker/init-test-db.sql:/docker-entrypoint-initdb.d/10-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U obligraph"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://obligraph:obligraph@db:5432/obligraph
      RUN_WORKER_IN_API: "false"
      PUBLIC_URL: http://localhost:3000
      STORAGE_DIR: /data
    volumes:
      - obligraph-files:/data
    command: sh -c "alembic upgrade head && obligraph seed --demo && uvicorn obligraph.api.app:app --host 0.0.0.0 --port 8000"
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy

  worker:
    build: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://obligraph:obligraph@db:5432/obligraph
      STORAGE_DIR: /data
    volumes:
      - obligraph-files:/data
    command: obligraph worker
    depends_on:
      api:
        condition: service_started

  web:
    build: ./frontend
    environment:
      OBLIGRAPH_API_URL: http://api:8000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - api

volumes:
  obligraph-db:
  obligraph-files:
